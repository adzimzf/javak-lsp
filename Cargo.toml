[package]
name = "javak-lsp"
version = "0.1.0"
edition = "2024"

[dependencies]
dashmap = "5"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
tower-lsp = "0.20"
tree-sitter = "0.26"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
futures = "0.3.34"
tempfile = "3.27.0"
